plugins {
    id "com.android.application"
}

android {
    namespace "ai.openclaw.dashboard"
    compileSdk 35

    defaultConfig {
        applicationId "ai.openclaw.dashboard"
        minSdk 31
        targetSdk 35
        versionCode 55
        versionName "1.0.55"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
