<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="John's private OpenClaw app hub">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <title>OpenClaw Hub</title>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main>
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img"><path d="M16 20c6-8 26-8 32 0M18 44c7 7 21 7 28 0M23 16c-4 6-4 26 2 34M41 16c4 6 4 26-2 34M12 29l12 5M52 29l-12 5"/></svg>
        </div>
        <div>
          <p class="eyebrow">PRIVATE TAILNET</p>
          <h1>OpenClaw Hub</h1>
          <p class="lede">One place for your agents, voice, knowledge, contacts, and system tools.</p>
        </div>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh app status">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          <span>Refresh</span>
        </button>
      </header>

      <section class="summary" aria-live="polite">
        <span class="summary-dot loading" id="summaryDot"></span>
        <span id="summaryText">Checking services…</span>
        <time id="updatedAt"></time>
      </section>

      <section class="apps" id="apps" aria-label="OpenClaw applications">
        <div class="loading-card"><span></span><span></span><span></span></div>
      </section>

      <footer>
        <span>Available only on your Tailscale network</span>
        <span class="separator">•</span>
        <span id="hostLabel"></span>
      </footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
